[package]
name = "agent-talk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Send messages to other agent sessions (Codex, Claude Code, OpenCode, Grok CLI, Antigravity CLI) through their official interfaces, from a shell or over MCP"
license = "MIT"
repository = "https://github.com/legibet/agent-talk"
readme = "README.md"
keywords = ["agents", "mcp", "codex", "claude-code", "opencode"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "tests/", "AGENTS.md", "CLAUDE.md"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
jiff = "0.2.37"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync", "io-util", "fs"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[[bin]]
name = "agent-talk"
path = "src/main.rs"
