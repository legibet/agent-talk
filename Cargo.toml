[package]
name = "agent-talk"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Send messages to other agent sessions (Codex, Claude Code, OpenCode, Grok CLI, Antigravity CLI, pi) through their official interfaces, from a shell or over MCP"
license = "MIT"
repository = "https://github.com/legibet/agent-talk"
readme = "README.md"
keywords = ["agents", "mcp", "codex", "claude-code", "opencode"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "tests/", "AGENTS.md", "CLAUDE.md", "dist-workspace.toml"]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
jiff = "0.2.37"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync", "io-util", "fs"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[[bin]]
name = "agent-talk"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# BeautifulRust's drop-in lints (https://github.com/morganlinton/BeautifulRust) without the
# library-only ones, `unreachable_pub` (a binary) and `as_conversions` (paging arithmetic;
# lossy casts are still caught). The last five allows: record field values in prose, JSON
# field names, async trait impls without an await, long adapter functions and
# `assert!(x.is_empty())`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
doc_markdown = "allow"
struct_field_names = "allow"
unused_async_trait_impl = "allow"
assert_is_empty = "allow"
too_many_lines = "allow"
